# ─────────────────────────────────────────────────────────────────────────────
# Central bank policy decisions, for the Markets calendar. Copied from each bank's own published
# schedule (links below), checked November 2026. The date is the decision / announcement day.
# The banks publish next year's dates during the year: add them here when they do. The checker
# (python pipeline/check_sources.py --validate-only) warns when fewer than 60 days are left.
# Statistical releases (BLS, BEA) and Treasury auctions come from their own calendars, by code.
# ─────────────────────────────────────────────────────────────────────────────

banks:
  - name: Federal Reserve (FOMC)
    url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    note: "Two-day meetings; the decision is announced on the second day. Dates are tentative until confirmed at the previous meeting."
    dates: [2026-12-09, 2027-01-27, 2027-03-17, 2027-04-28, 2027-06-09, 2027-07-28, 2027-09-15, 2027-10-27, 2027-11-17]
  - name: European Central Bank
    url: https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html
    note: "Monetary policy meeting, day 2, followed by a press conference."
    dates: [2026-12-17, 2027-02-04, 2027-03-18, 2027-04-29, 2027-06-10, 2027-07-22, 2027-09-09, 2027-10-28, 2027-12-16]
  - name: Bank of England (MPC)
    url: https://www.bankofengland.co.uk/monetary-policy/upcoming-mpc-dates
    note: "Bank Rate announcement and MPC summary and minutes."
    dates: [2026-12-17, 2027-02-04, 2027-03-18, 2027-04-29, 2027-06-17, 2027-07-29, 2027-09-16, 2027-11-04, 2027-12-16]
  - name: Bank of Japan
    url: https://www.boj.or.jp/en/mopo/mpmsche_minu/index.htm
    note: "Second day of the Monetary Policy Meeting."
    dates: [2026-12-18, 2027-01-22, 2027-03-18, 2027-04-28, 2027-06-11, 2027-07-22, 2027-09-22, 2027-10-29, 2027-12-17]
