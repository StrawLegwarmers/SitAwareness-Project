# ─────────────────────────────────────────────────────────────────────────────
# MARKETS sources: every feed the Markets site reads. Each feed URL was tested (Nov 2026).
#
# FIELDS
#   name     Display name shown on the site.
#   feed     The RSS/Atom URL.
#   section  news      market and company news: grouped into stories, reports written by the AI
#            official  central banks, statistics offices, regulators: a plain list, no AI
#            analysis  analysis and commentary from outlets: listed and labelled, never restated
#   type     wire | international | regional | specialist | government (optional; wires rank first)
#   kind     analysis for opinion and analysis feeds (kept out of stories)
#   lang     Language code.
#
# Paywalled outlets (FT, WSJ, Bloomberg, The Economist): only the headline and the short summary
# their public feed carries are used, always with a link back. Article pages are never fetched.
# Not used: Yahoo Finance (its feed terms forbid modified display), Seeking Alpha (its terms
# forbid automated reproduction), and index levels such as the S&P 500 or Dow (licensed data).
# Not working from a cloud server (HTTP 403): BLS feeds (the calendar step reads BLS with a
# contact address instead) and Mining.com.
# ─────────────────────────────────────────────────────────────────────────────

sources:

  # ── News: grouped into stories ────────────────────────────────────────────
