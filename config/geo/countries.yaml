# ─────────────────────────────────────────────────────────────────────────────
# Countries: which country a story is ABOUT, and which region page it belongs on.
#
# No AI. pipeline/countries.py looks for these names in each story's title, reports and
# headlines, and counts them. A story goes on the page of the region its countries are in;
# if its countries are spread over several regions, it goes on Global.
#
#   id        short name used in the website's addresses (#/geo/europe/c-poland)
#   region    namerica | latam | europe | mena | africa | asia   (the geo page it belongs on)
#   global    tier 1-3: how much the country matters worldwide   (orders "Countries in the news")
#   regional  tier 1-3: how much it matters in its region        (orders the region page;
#             tier 1 countries ALWAYS get a block on their region page, even on a quiet day)
#   also      other words that mean this country: people, capital, institutions.
#             Matching is CASE-SENSITIVE, so "US" never matches the word "us".
#   ambiguous true = the name alone means something else too (Georgia, the US state), so only
#             the words under "also" count.
#
# Tiers are YOUR judgement as an analyst, set here and nowhere else. They only change the
# ORDER things are shown in and which blocks always appear. They never hide or rank reporting.
# Missing tiers count as 3. Leaders' names are left out on purpose: they change. Add any you
# want under "also".
# ─────────────────────────────────────────────────────────────────────────────

# Phrases that contain a country word but aren't about that country. Removed before matching.
not_countries: [Latin America, Latin American, Latin Americans, South America, South American, Central America,
                Central American, North America, North American, the Americas, Pan-American, Inter-American,
                New Mexico, Indian Ocean, Indian Premier League, West Indies, Turkey Day, Jim Jordan, Michael Jordan,
                French Open, Irish Sea, Persian Gulf, Arabian Sea, Arab League, Arab world, Georgia Tech, New Guinea Highlands,
                Gulf of Mexico, Gulf of America, Panama Papers, Brazil nut, Swiss cheese, Chinese New Year, Dutch auction,
                Jordan Bardella, Jordan Peterson, Washington Post, South China Morning Post, Paris Agreement,
                Paris climate, Paris Saint-Germain, Paris Club, Rome Statute, Indian National Congress, Real Madrid, Atletico Madrid]

# Cities that often HOST talks about other countries ("Russia-Ukraine talks in Abu Dhabi").
# A match here counts a quarter, so the venue doesn't outweigh the countries being discussed.
# (Capitals like Moscow or Beijing aren't here: they usually mean that country's government.)
venues: [Abu Dhabi, Dubai, Doha, Riyadh, Jeddah, Istanbul, Cairo, Muscat, Baku, Vienna, Oslo, The Hague,
         Abu Dabi, Riad, Riyad, Estambul, İstanbul, El Cairo, Le Caire, Kairo, Wien, Den Haag, الرياض, دبي, أبوظبي, Баку]

