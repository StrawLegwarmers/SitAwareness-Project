# ─────────────────────────────────────────────────────────────────────────────
# Country names in other languages. Added to the "also" words in countries.yaml.
#
# About half the geopolitical headlines are NOT in English (Spanish, Chinese, Arabic, French,
# Portuguese, German, Russian, Bulgarian, Swedish, Serbian...). Without these names, a headline
# like "Профсоюзы Испании..." or "En Espagne, une grève générale..." is never linked to Spain.
#
# Rules, same as countries.yaml: CASE-SENSITIVE, proper names only (not "ruso", "chinois").
#   Name*   a star means "and any ending": Испани* = Испания, Испании, Испанию. Languages like
#           Russian, Polish, Serbian and German change the end of a name (Russland, Russlands).
#   Chinese and Japanese names match anywhere in a headline (those languages have no spaces).
#   Arabic names also match after the one-letter prefixes و ب ل ف ك ("and", "in", "for"...).
# Add a language, or a country to a language, at any time. Ids are those in countries.yaml.
# ─────────────────────────────────────────────────────────────────────────────

