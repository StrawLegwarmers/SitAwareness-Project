# ─────────────────────────────────────────────────────────────────────────────
# GEO toolkit: reference links, not news feeds.
#
# Common OSINT bookmarks and X/Twitter accounts. Nothing here is
# fetched or analysed; the site shows it as a "Toolkit" page so analysts keep
# their OSINT tools next to the daily brief. Add or remove links freely.
# ─────────────────────────────────────────────────────────────────────────────

