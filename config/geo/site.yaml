# ─────────────────────────────────────────────────────────────────────────────
# GEO site settings: how the AI should think about this site.
# ─────────────────────────────────────────────────────────────────────────────

name: Geopolitical Daily

# What counts as a story here, and what to skip. These lines go straight into the AI prompt.
focus: >-
  geopolitics, armed conflict, diplomacy, elections and political crises, domestic politics and
  government policy (laws, regulation, appointments and purges, protests), security, sanctions and
  economic shocks, energy, migration, humanitarian emergencies, and major outages of critical services
ignore: >-
  sports, entertainment, celebrity, lifestyle, horoscopes, adverts, routine local crime,
  weather (unless it is a disaster), medicine and health advice (outbreaks excepted), and company
  or market news with no tie to governments, sanctions, security, conflict or critical supply chains

# Topics this site keeps (the AI labels every new story with one: narratives.py TOPICS, prompt
# rule 13). A new story with any other topic is not created, and the audit log says why.
# Company and market news stays only as business-strategic / markets-strategic.
topics: [conflict, security, diplomacy, politics, elections, justice, economy, energy, infrastructure,
         migration, humanitarian, disaster, health-emergency, cyber, technology-policy, crime,
         business-strategic, markets-strategic]

# Groups: one per region. Articles belong to the group whose id matches their source's 'region'
# (sources.yaml). Add a region to sources.yaml and a line here, and the site gets a new section.
# All groups are collected together: code groups the day's headlines (pipeline/cluster.py), the
# AI checks the groups, and a new story is filed under the region it is ABOUT (countries.py).
# "short" is the code a card shows on pages that mix regions (Overview, Global).
groups:
  - {id: namerica, name: North America,              short: NA}
  - {id: latam,    name: Latin America & Caribbean,  short: LATAM}
  - {id: europe,   name: Europe,                     short: EU}
  - {id: mena,     name: Middle East & North Africa, short: MENA}
  - {id: africa,   name: Africa,                     short: AFR}
  - {id: asia,     name: Asia & Pacific,             short: APAC}
  - {id: global,   name: Global,                     short: GLOBAL}

# The sidebar. Pages are shown in THIS order. "show" lists what each page contains, top to bottom:
#   bluf      Bottom line up front           top         Most reported (cards)
#   regions   every region at a glance       countries   countries in the news, hotspots first
#   worldwide the stories reported in the most regions (reach), whatever region they are about
#   quality   collection and checks: articles collected, events found, reports kept and removed
#   group:<id>  one region: its stories by country (config/geo/countries.yaml), plus its
#               opinion and analysis pieces
# "icon" is the picture in the sidebar: dashboard, world, europe, north-america, asia, mena,
# latin-america, africa, brief, briefcase, plane, fingerprint, flask, broadcast, tool, rss, link
# (see ICONS in app.js).
# Ids may only use a-z, 0-9 and "-".
pages:
  - {id: overview, name: Overview,                    icon: dashboard,     show: [bluf, top, countries, regions, quality]}
  - {id: global,   name: Global,                      icon: world,         show: [worldwide, group:global]}
  - {id: europe,   name: Europe,                      icon: europe,        show: [group:europe]}
  - {id: namerica, name: North America,               icon: north-america, show: [group:namerica]}
  - {id: asia,     name: Asia & Pacific,              icon: asia,          show: [group:asia]}
  - {id: mena,     name: Middle East & North Africa,  icon: mena,          show: [group:mena]}
  - {id: latam,    name: Latin America & Caribbean,   icon: latin-america, show: [group:latam]}
  - {id: africa,   name: Africa,                      icon: africa,        show: [group:africa]}

# Weekend catch-up: on these weekdays the brief covers more than one day.
# monday: 4  =  Friday, Saturday, Sunday and Monday, so nothing from the weekend is missed.
# Add e.g. "tuesday: 2" after a bank holiday, or delete the line to turn it off.
# Keep expire_days (below) longer than the longest catch-up, so stories are still tracked.
catch_up_days:
  monday: 4

# Housekeeping: daily briefs older than this many days are removed from the website.
# Git keeps every old version in its history, so they can always be recovered.
keep_days: 365

expire_days: 6       # a narrative with no new reporting for this many days is archived
