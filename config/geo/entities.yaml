# ─────────────────────────────────────────────────────────────────────────────
# Entities: names that point to a country without naming it.
#
# "Nvidia boss questioned by FBI" never says "United States", but both names do. These lists
# let pipeline/countries.py place such stories by what they are about. No AI is involved.
#
#   places        cities, states and provinces that aren't already in countries.yaml
#   institutions  government bodies, armed forces and armed groups
#   people        political figures, whether or not they are still in office (a former
#                 leader still belongs to the same country)
#   companies     large companies, by the country of their headquarters. They count HALF,
#                 so "EU fines a US company" still leans to the country taking the action.
#
# Under each heading: country id (from countries.yaml): [names]. Matching is CASE-SENSITIVE
# and whole-word, like countries.yaml. A name already listed there (capitals, "Kremlin"...)
# isn't needed here. Leave out names that also mean something else ("Nice", "Georgia").
# When an entity misleads placement, delete it here, or fix one story in corrections.yaml.
# ─────────────────────────────────────────────────────────────────────────────

