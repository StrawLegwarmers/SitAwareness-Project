# ─────────────────────────────────────────────────────────────────────────────
# GEO sources: every feed the Geopolitical site reads.
#
# A curated list of global, regional and local outlets covering Europe, MENA,
# Africa and the Russia-Ukraine, Israel-Gaza and Iran conflicts. Each feed URL was tested.
#
# HOW TO ADD A SOURCE
#   1. Find its feed:   python pipeline/check_sources.py --discover https://example.com
#   2. Copy one block below, paste it in the right region, change the values.
#   3. Test it:         python pipeline/check_sources.py --site geo
#
# FIELDS
#   name     Display name shown on the site.
#   feed     The RSS/Atom URL (not the homepage).
#   region   global | namerica | europe | mena | africa  (add more any time)
#   topics   Optional tags that match a running conflict or theme.
#   type     wire | international | regional | local | think-tank | state-media
#            The AI uses this: state-media claims get attributed, never stated as fact.
#   lang     Language code (en, fr, ar...). The AI reads all of them and writes English.
#   enabled  false = keep it on file but don't fetch it. Use 'note' to say why.
# ─────────────────────────────────────────────────────────────────────────────

sources:

  # ── Global ────────────────────────────────────────────────────────────────
  - {name: Al Jazeera,        feed: "https://www.aljazeera.com/xml/rss/all.xml",               region: global, type: international, lang: en}
  - {name: BBC World,         feed: "https://feeds.bbci.co.uk/news/world/rss.xml",              region: global, type: international, lang: en}
  - {name: New York Times World, feed: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml", region: global, type: international, lang: en}
  - {name: The Guardian World, feed: "https://www.theguardian.com/world/rss",                   region: global, type: international, lang: en}
  - {name: DW,                feed: "https://rss.dw.com/rdf/rss-en-all",                        region: global, type: international, lang: en}
  - {name: France 24,         feed: "https://www.france24.com/en/rss",                          region: global, type: international, lang: en}
  # Reuters and AP have no public RSS. A Google News search feed is a common workaround:
  # news.google.com/rss/search?q=<query> returns any search as a feed.
  - {name: Reuters,           feed: "https://news.google.com/rss/search?q=site:reuters.com+world&hl=en-US&gl=US&ceid=US:en", region: global, type: wire, lang: en, note: "via Google News search"}
  - {name: Associated Press,  feed: "https://news.google.com/rss/search?q=site:apnews.com+world&hl=en-US&gl=US&ceid=US:en",  region: global, type: wire, lang: en, note: "via Google News search"}
  - {name: Crisis Group,      feed: "https://www.crisisgroup.org/rss/",                         region: global, type: think-tank, lang: en, note: "items have no dates; pipeline uses first-seen time"}

