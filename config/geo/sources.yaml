# ─────────────────────────────────────────────────────────────────────────────
# GEO sources: every feed the Geopolitical site reads.
#
# A curated list of global, regional and local outlets covering Europe, MENA,
# Africa and the Russia-Ukraine, Israel-Gaza and Iran conflicts. Each feed URL was tested.
#
# HOW TO ADD A SOURCE
#   1. Find its feed:   python pipeline/check_sources.py --discover https://example.com
#   2. Copy one block below, paste it in the right region, change the values.
#   3. Test it:         python pipeline/check_sources.py --site geo
#
# FIELDS
#   name     Display name shown on the site.
#   feed     The RSS/Atom URL (not the homepage).
#   region   global | namerica | latam | europe | mena | africa | asia  (add more any time)
#   topics   Optional tags that match a running conflict or theme.
#   type     wire | international | regional | local | think-tank | state-media
#            | specialist (defence, energy, security press) | government (official releases, travel advice)
#            The AI uses this: state-media claims get attributed, never stated as fact.
#   lang     Language code (en, fr, ar...). The AI reads all of them and writes English.
#   enabled  false = keep it on file but don't fetch it. Use 'note' to say why.
# ─────────────────────────────────────────────────────────────────────────────

sources:

