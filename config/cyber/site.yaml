# ─────────────────────────────────────────────────────────────────────────────
# CYBER site settings: how the AI should think about this site.
# ─────────────────────────────────────────────────────────────────────────────

name: Cyber Daily

focus: >-
  cyber threat intelligence: threat actors and campaigns, ransomware and extortion,
  exploited vulnerabilities, data breaches, government advisories and takedowns,
  cyber policy, and security incidents affecting aviation, airlines and aerospace
ignore: >-
  product marketing, webinars, funding rounds, generic tech news with no security angle,
  and aviation business news with no security or safety angle

# Cyber has one group that sees news, intel and aviation together, because the same campaign
# is often reported by a vendor blog AND the press. "advisories" is deliberately NOT here:
# vendor bulletins and vulnerability databases are high-volume, one-line items (Microsoft's
# feed alone carries thousands), so they're shown as plain lists instead of going to the AI.
groups:
  - {id: all, name: Cyber, sections: [news, intel, aviation]}

# Headline lists, straight from the feeds (no AI).
#   section: which sources (the 'section' field in sources.yaml)
#   days:    how far back to look
#   limit:   most items to show
lists:
  - {section: intel,      name: Vendor intelligence,        days: 7, limit: 60}   # vendor and lab research
  - {section: news,       name: Global intelligence,        days: 2, limit: 60}   # cyber news outlets
  - {section: aviation,   name: Aviation trade press,       days: 3, limit: 40}
  - {section: advisories, name: Advisories and bulletins,   days: 2, limit: 60}

# The sidebar. One line per page, in order. "show" lists what the page contains,
# top to bottom:
#   bluf        Bottom line up front          top          Most reported (cards)
#   stories     every story, by group         commentary   Opinion and analysis pieces
#   industries  industry sections (industries.yaml)
#   vulns       CISA KEV and CVEs in the news iocs         new indicators of compromise
#   quality     collection and checks: articles collected, events found, reports kept and removed
#   list:<section>  one of the headline lists above
# "icon" is the picture in the sidebar (names: see config/geo/site.yaml).
# Add, remove or reorder pages freely; ids may only use a-z, 0-9 and "-".
pages:
  - {id: brief,    name: Brief,                    icon: brief,       show: [bluf, top, stories, commentary, quality]}
  - {id: industry, name: Industry intelligence,    icon: briefcase,   show: [industries, list:aviation]}
  - {id: threats,  name: IOCs and vulnerabilities, icon: fingerprint, show: [vulns, iocs, list:advisories]}
  - {id: vendor,   name: Vendor intelligence,      icon: flask,       show: [list:intel]}
  - {id: global,   name: Global intelligence,      icon: broadcast,   show: [list:news]}

# Weekend catch-up: on these weekdays the brief covers more than one day.
# monday: 4  =  Friday, Saturday, Sunday and Monday, so nothing from the weekend is missed.
# Add e.g. "tuesday: 2" after a bank holiday, or delete the line to turn it off.
# Keep expire_days (below) longer than the longest catch-up, so stories are still tracked.
catch_up_days:
  monday: 4

# Housekeeping: daily briefs older than this many days are removed from the website.
# Git keeps every old version in its history, so they can always be recovered.
keep_days: 365

expire_days: 6
