# ─────────────────────────────────────────────────────────────────────────────
# Industry sections: the "Industry intelligence" page on the Cyber site.
#
# Each industry picks out items from EVERY source (cyber and geopolitical) using word lists:
#   topic:         words that mean "this is about the industry"
#   concern:       words that mean "this is a security, safety or disruption issue"
#                  (the shared list below, plus the industry's own "also_concern")
#   exclude:       phrases that contain a topic word but aren't about the industry
#   cyber_headline: true = for cyber sources too, the topic word must be IN THE HEADLINE.
#                  Needed for broad industries: almost every cyber article mentions software.
# Rules (plain code, no AI):
#   - Cyber news and research:   a topic word anywhere is enough (they're already about security)
#   - Everything else:           a topic word IN THE HEADLINE, and a concern word anywhere
#   - Vendor advisories are left out (thousands of one-line bulletins, already on the
#     IOCs and vulnerabilities page)
# Words in ALL CAPITALS (FAA, NHS) only match in capitals; everything else ignores case.
# Add an industry by copying a block: it appears on the Industry intelligence page with its own
# heading and button. An item can belong to several industries (a hospital's software supplier).
# ─────────────────────────────────────────────────────────────────────────────

# The concern words every industry shares.
concern: [cyber, cyberattack, cyberattacks, cyber attack, hack, hacked, hacker, hackers, ransomware, breach,
          data breach, data leak, leak, leaked, outage, outages, IT failure, system failure, attack, attacks,
          drone, drones, jamming, spoofing, phishing, DDoS, threat, threats, security, sabotage, closed, closure,
          evacuated, evacuation, bomb, explosion, blast, fire, missile, strike, strikes, shutdown, disruption,
          disrupted, espionage, spy, malware, vulnerability, exploit, extortion, stolen, theft, fraud, scam,
          sanctions, sanctioned, seized, seizure, raid, arrested, shortage, collapse, crash]

