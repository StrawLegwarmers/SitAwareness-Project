# ─────────────────────────────────────────────────────────────────────────────
# Publishers: several feeds from ONE news organisation count as ONE outlet.
#
# Without this, a story covered by "BBC World" and "BBC Africa" would show as
# "2 outlets", inflating the ranking and hiding single-source stories.
# Format:  Publisher name: [source names from sources.yaml]
# A source that isn't listed here counts as its own publisher.
# ─────────────────────────────────────────────────────────────────────────────

# Geopolitical
BBC: [BBC Business, BBC World, BBC Europe, BBC Middle East, BBC Africa, BBC Israel-Gaza, BBC Pidgin, BBC News,
      BBC Latin America, BBC US & Canada, BBC Asia]
