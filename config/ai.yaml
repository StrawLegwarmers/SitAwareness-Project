# ─────────────────────────────────────────────────────────────────────────────
# Which AI model writes the narratives.
#
# Switching provider is a one-line change. The API key always comes from an
# environment variable (never from this file, because this file is public):
#   gemini     -> GEMINI_API_KEY      free tier at aistudio.google.com
#   anthropic  -> ANTHROPIC_API_KEY   paid, console.anthropic.com
#   mock       -> no key; fake answers for testing the pipeline offline
# ─────────────────────────────────────────────────────────────────────────────

provider: gemini
model: gemini-3.5-flash-lite       # free tier. For better writing try gemini-3.8-flash
                                   # (anthropic example: claude-haiku-5-5)

pause_seconds: 15        # wait between AI calls, to stay under free-tier rate limits

# Your project's limits for this model (Google AI Studio -> Usage -> rate limits). The pipeline uses
# at most `share` of each: it waits when a minute is full, and stops calling (the rest waits for the
# next run) when the day's budget is used. The day count is in state/ai-usage.json. 0 = no check.
limits:
  requests_per_minute: 15
  input_tokens_per_minute: 250000
  requests_per_day: 500
  share: 0.8
max_output_tokens: 16384 # longest answer allowed. An answer cut off at this limit is retried as two smaller calls.

# What each run collects. Code groups the headlines first (pipeline/cluster.py); only groups
# reported by 2+ outlets, or continuing a tracked story, go to the AI, about 40 per call.
max_per_source: 60       # newest N articles per source per run (some outlets post 150+ a day)
max_per_run: 4000        # all articles per run; if exceeded, every source is trimmed evenly
batch_groups: 40         # groups per AI call
batch_articles: 300      # articles per AI call (each group shows at most group_articles)
group_articles: 10       # articles of one group the AI sees; the rest are added by code if they match
max_calls: 8             # AI calls per site per run. Groups that don't fit wait for the next run.
