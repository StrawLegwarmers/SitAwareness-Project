# ─────────────────────────────────────────────────────────────────────────────
# The brief robot. Runs every 3 hours.
#
# Each time GitHub starts a fresh Linux machine, and this file tells it what to do:
#   1. get the repo                      5. write the website's JSON (export)
#   2. install Python + libraries         6. save the database and website data for the next run
#   3. bring back the last run's          7. commit the stories' memory (state/), and each finished
#      database and website data              day of website data (site/data/) once
#   4. fetch feeds, run the AI            8. publish site/ to GitHub Pages
#
# Each run groups the last 24 hours of headlines; the AI only sees what is new since it last
# looked (docs/operations.md, "Several runs a day"). Run it by hand any time: Actions tab ->
# "Daily brief" -> "Run workflow".
# ─────────────────────────────────────────────────────────────────────────────
name: Daily brief

on:
  schedule:
    # Every 3 hours, at 00:37, 03:37 ... 21:37 UTC. Off the hour on purpose: GitHub delays (or even
    # drops) scheduled runs at the start of each hour when it's busy. A dropped run is caught up by
    # the next one, since each run looks at the last 24 hours.
    - cron: "37 */3 * * *"
  workflow_dispatch: {}           # the "Run workflow" button

permissions: {}

concurrency:                    # never run two briefs at the same time
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
        contents: write
        pages: write
    steps:
      - name: Get the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      # The database (data/sitaware.db) is working memory, not committed to Git; so is today's
      # website data until the day is over. GitHub's cache keeps both between runs. If the cache is
      # ever lost, the pipeline rebuilds the database from the feeds; the stories' memory (state/)
      # and every finished day of website data are in Git.
      - name: Bring back the last run's database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/sitaware.db
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Bring back the last run's website data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: site/data
          key: site-${{ github.run_id }}
          restore-keys: site-

      - name: Fetch feeds
        run: python pipeline/fetch.py

      # A feed failing on every run for 7 days is turned off, with a dated note in sources.yaml.
      # Re-enable it with a "Change a source" issue. Never stops the brief.
      - name: Turn off feeds that keep failing
        run: python pipeline/manage_sources.py auto-disable
        continue-on-error: true

      # continue-on-error: a problem with an indicator source must never block the brief.
      - name: Collect exploited vulnerabilities and IOCs
        run: python pipeline/indicators.py
        continue-on-error: true
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}   # optional: ThreatFox is skipped if not set

      # Markets: official rates, the 7-day calendar and SEC filings, read by code. Never blocks the brief.
      # The SEC (and BLS) ask automated requests for a contact email: it is only sent to them, in the
      # request header, and never written anywhere. Without the secret, filings are skipped.
      - name: Market data (rates, calendar, SEC filings)
        run: python pipeline/markets_data.py
        continue-on-error: true
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

      - name: Group stories and collect reports
        run: python pipeline/narratives.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Write the website's data
        run: python pipeline/export.py

      - name: Save the database for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/sitaware.db
          key: db-${{ github.run_id }}

      - name: Save the website data for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: site/data
          key: site-${{ github.run_id }}

      # Commits are made by GitHub's own bot account, so they don't carry your name or email.
      # state/ is committed every run (small). Website data is committed once a day: a finished
      # day's files at the next day's first run, and today's at the evening run as a safety copy.
      # Committing it 8 times a day would grow the repository by about 1 GB a year.
      - name: Commit the stories' memory (and finished days of website data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state site/data config/*/sources.yaml
          TODAY=$(date -u +%F)
          FINISHED=$(git diff --cached --name-only -- site/data | grep -E '[0-9]{4}-[0-9]{2}-[0-9]{2}' | grep -v "$TODAY" || true)
          if [ -z "$FINISHED" ] && [ "$(date -u +%H)" -lt 21 ]; then
            git reset -q -- site/data      # nothing finished yet: today's files are published, not committed
          fi
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Brief $(date -u '+%F %H:%M') UTC"
          git pull --rebase --autostash
          git push

      - name: Prepare the site for Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
