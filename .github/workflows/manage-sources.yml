# ─────────────────────────────────────────────────────────────────────────────
# Manage sources from the browser.
#
# Open an issue with the "Add a source" or "Change a source" form. This workflow:
#   1. checks the issue is yours          4. commits the change to sources.yaml
#   2. reads the form's answers           5. replies on the issue (and closes it if it worked)
#   3. tests the feed and edits the file
#
# SECURITY. Anyone can open an issue on a public repository, so:
#   - only the owner (or people you gave write access) can trigger a change ("if:" below)
#   - the issue's text is handed to Python in an environment variable. It is NEVER written
#     into a "run:" command with ${{ }}, because that would let a crafted title run commands
#     on the robot (this is called script injection).
# ─────────────────────────────────────────────────────────────────────────────
name: Manage sources

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write     # commit the change
  issues: write       # reply on the issue and close it

concurrency:
  group: manage-sources
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      (startsWith(github.event.issue.title, 'Add source') || startsWith(github.event.issue.title, 'Change source'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Apply the request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python pipeline/manage_sources.py from-issue --out result.md

      - name: Commit the change
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Sources: change requested in issue #$NUMBER"
          git pull --rebase --autostash
          git push

      - name: Reply on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          test -s result.md || echo "Something went wrong before a result was written. See the Actions log." > result.md
          gh issue comment "$NUMBER" --repo "$REPO" --body-file result.md
          if grep -q "^Done" result.md; then gh issue close "$NUMBER" --repo "$REPO"; fi
