name: Tests

on:
  push:
    paths-ignore: ["site/data/**", "state/**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -q

      - name: Check the website's JavaScript parses
        run: node --check site/assets/app.js && node --check site/assets/theme.js

      - name: Check the configuration files
        run: python pipeline/check_sources.py --validate-only
