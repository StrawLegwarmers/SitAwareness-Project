# The "Change a source" form. The "Manage sources" workflow reads it and does the rest.
name: Change a source
description: Disable, enable or remove a source.
title: "Change source: "
labels: [source]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: Exactly as on the website's Sources page.
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: What to do
      options: [Disable, Enable, Remove]
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason (optional)
